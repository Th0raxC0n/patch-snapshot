name: Request a contract snapshot
description: Request a focused, evidence-first Patch Check of a public EVM contract.
title: "[snapshot]: "
body:
  - type: markdown
    attributes:
      value: |
        Patch Checks are public, read-only preflight receipts. Never include seed phrases, private keys, API keys or other secrets.
  - type: dropdown
    id: chain
    attributes:
      label: Chain
      description: Which network is the contract deployed on?
      options:
        - Base
        - Ethereum
        - Arbitrum One
        - OP Mainnet
        - Other
    validations:
      required: true
  - type: input
    id: address
    attributes:
      label: Contract address
      description: The public EVM contract address to inspect.
      placeholder: "0x..."
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Exact question
      description: What decision or permission question should the snapshot help answer?
      placeholder: "Who can upgrade this contract at the current block?"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting links
      description: Optional public explorer, documentation or transaction links.
      placeholder: "https://..."
  - type: markdown
    attributes:
      value: |
        ### Optional PATCH priority lane
        The open-source tool and normal request queue remain free. If Patch quoted a priority price for this request, transfer that amount on Robinhood Chain and provide the transaction hash below. Do not send tokens without a current quote.
  - type: input
    id: patch-payment
    attributes:
      label: PATCH payment transaction
      description: Optional Robinhood Chain transaction hash for a quoted priority request. Each transaction may be claimed once.
      placeholder: "0x..."
  - type: input
    id: patch-quote
    attributes:
      label: Quoted PATCH minimum
      description: Optional amount quoted for this request so the payment can be verified reproducibly.
      placeholder: "25000"
  - type: dropdown
    id: public-report
    attributes:
      label: Public report permission
      description: May the resulting snapshot and concise findings be published in this issue?
      options:
        - "Yes"
        - "No, contact me before publishing findings"
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Scope and safety
      options:
        - label: I have not included secrets, credentials, seed phrases or private keys.
          required: true
        - label: I understand this is a focused preflight receipt, not a comprehensive audit or guarantee of safety.
          required: true
        - label: If I supplied a PATCH transaction, I understand payment buys queue priority—not a favorable finding, safety verdict or guaranteed completion time.
          required: true
